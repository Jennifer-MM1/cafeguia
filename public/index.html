<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="CaféGuía: descubre cafeterías, deja reseñas aunque no tengas internet y recibe avisos.">
  <title>CaféGuía</title>
  <link rel="stylesheet" href="css/estilos.css">

  <!-- Fase 2: manifiesto e íconos -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b1a12">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <!-- iOS no lee los íconos del manifiesto: necesita estas etiquetas -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CaféGuía">
</head>
<body>
  <!-- Fase 5.2 · Splash dentro de la app: cubre la pantalla mientras arranca el enrutador -->
  <div id="splash" class="splash" role="status" aria-label="Cargando CaféGuía">
    <span class="splash-logo" aria-hidden="true">☕</span>
    <span class="splash-texto">CaféGuía</span>
  </div>

  <!-- ===== APP SHELL: lo que siempre se ve, se guarda en caché y carga al instante ===== -->
  <header class="barra">
    <a class="marca" href="#/">
      <span class="marca-logo" aria-hidden="true">☕</span>
      <span class="marca-nombre">CaféGuía</span>
    </a>
  </header>

  <nav class="menu" aria-label="Navegación principal">
    <a href="#/" data-ruta="inicio">Inicio</a>
    <a href="#/catalogo" data-ruta="catalogo">Catálogo</a>
    <a href="#/cerca" data-ruta="cerca">Cerca de mí</a>
    <a href="#/ajustes" data-ruta="ajustes">Ajustes</a>
  </nav>

  <!-- Aquí el enrutador (CSR) pinta cada vista -->
  <main id="vista" class="vista" tabindex="-1">
    <p class="cargando">Cargando…</p>
  </main>

  <footer class="pie">
    <small>CaféGuía · PWA de ejemplo</small>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
